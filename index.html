<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pendientes</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#2f6f8f">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#e9eef2;--card:#fbfcfd;--ink:#1d2b3a;--mute:#6b7c8c;--line:#d5dde4;--accent:#2f6f8f;--warn:#c4472f;--warnbg:#fbe9e4;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141c24;--card:#1c2733;--ink:#e6edf3;--mute:#8a9bab;--line:#2c3a48;--accent:#6fb4d4;--warn:#ff8d73;--warnbg:#3a2420;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141c24;--card:#1c2733;--ink:#e6edf3;--mute:#8a9bab;--line:#2c3a48;--accent:#6fb4d4;--warn:#ff8d73;--warnbg:#3a2420;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:500 16px/1.4 Figtree,system-ui,sans-serif;min-height:100vh}
main{max-width:460px;margin:0 auto;padding:24px 16px 40px}
header{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:16px}
h1{font-size:26px;font-weight:700;margin:0;letter-spacing:-.02em}
.tools button{background:none;border:1px solid var(--line);color:var(--mute);border-radius:8px;padding:5px 10px;font:inherit;font-size:13px;cursor:pointer;margin-left:6px}
.tools button:hover{color:var(--ink);border-color:var(--mute)}
.add{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;display:grid;grid-template-columns:1fr auto;gap:8px;margin-bottom:20px}
.add input{font:inherit;color:var(--ink);background:var(--bg);border:1px solid transparent;border-radius:9px;padding:9px 11px;min-width:0}
.add input:focus{outline:2px solid var(--accent);outline-offset:0}
.add .title{grid-column:1/-1;font-size:16px}
.add .row{grid-column:1/-1;display:flex;gap:8px}
.add .row input{flex:1;font-size:14px}
.add button{background:var(--accent);color:var(--card);border:0;border-radius:9px;padding:0 16px;font:inherit;font-weight:600;cursor:pointer}
ul{list-style:none;margin:0;padding:0}
li{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-left:5px solid var(--c,var(--line));border-radius:12px;padding:12px 12px 12px 14px;margin-bottom:8px;transition:opacity .2s}
body.compact li{padding:7px 10px 7px 12px;margin-bottom:5px;gap:10px}
body.compact{font-size:14px}
li.urgent{background:var(--warnbg)}
li.done{opacity:.55}
li.done .t{text-decoration:line-through;text-decoration-thickness:1.5px}
.chk{appearance:none;flex:none;width:22px;height:22px;border:2px solid var(--mute);border-radius:7px;margin:0;cursor:pointer;display:grid;place-items:center;background:transparent}
.chk:checked{background:var(--accent);border-color:var(--accent)}
.chk:checked::after{content:"";width:6px;height:11px;border:solid var(--card);border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.chk:focus-visible,.tools button:focus-visible,.add button:focus-visible,.x:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.body{flex:1;min-width:0}
.t{overflow-wrap:anywhere}
.meta{font-size:12.5px;color:var(--mute);display:flex;gap:10px;margin-top:2px;flex-wrap:wrap}
.meta .m{color:var(--c);font-weight:600}
li.urgent .meta .d{color:var(--warn);font-weight:600}
.x{background:none;border:0;color:var(--mute);font-size:20px;line-height:1;cursor:pointer;padding:4px 6px;border-radius:6px;opacity:.6}
.x:hover{opacity:1;color:var(--warn)}
.sep{font-size:13px;color:var(--mute);margin:18px 2px 8px;display:flex;justify-content:space-between;align-items:center}
.sep button{background:none;border:0;color:var(--accent);font:inherit;font-size:13px;cursor:pointer;padding:0}
.empty{text-align:center;color:var(--mute);padding:26px 0}
</style>
</head>
<body>
<main>
<header>
  <h1>Pendientes</h1>
  <div class="tools"><button id="bc" type="button">Compacto</button><button id="bt" type="button">Oscuro</button></div>
</header>
<form class="add" id="f" onsubmit="return false">
  <input class="title" id="ti" placeholder="¿Qué tenés que hacer?" autocomplete="off" maxlength="140">
  <div class="row">
    <input id="ma" list="mats" placeholder="Materia" autocomplete="off" maxlength="30">
    <datalist id="mats"></datalist>
    <input id="fe" type="date" aria-label="Fecha de entrega">
  </div>
  <button type="submit" id="go" style="grid-column:2;grid-row:3;padding:9px 16px">Agregar</button>
</form>
<ul id="lp"></ul>
<div class="sep" id="sp" hidden><span id="nc"></span><button type="button" id="th"></button></div>
<ul id="ld"></ul>
</main>
<script>
(function(){
var K="pendientes-v1",S={tasks:[],compact:false,theme:"",hide:false};
try{var r=localStorage.getItem(K);if(r){var p=JSON.parse(r);if(p&&Array.isArray(p.tasks))S=Object.assign(S,p)}}catch(e){}
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}}
var $=function(i){return document.getElementById(i)};
var COL=["#2f6f8f","#c0762f","#6b8f3a","#8a5aa8","#b8475f","#3a8f84"];
function color(m){if(!m)return"";var h=0;for(var i=0;i<m.length;i++)h=(h*31+m.charCodeAt(i))>>>0;return COL[h%COL.length]}
function today(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function fmt(s){var a=s.split("-"),d=new Date(+a[0],+a[1]-1,+a[2]),t=today();
 if(s===t)return"Hoy";var tm=new Date();tm.setDate(tm.getDate()+1);
 if(s===tm.getFullYear()+"-"+String(tm.getMonth()+1).padStart(2,"0")+"-"+String(tm.getDate()).padStart(2,"0"))return"Mañana";
 if(s<t)return"Venció el "+d.toLocaleDateString("es",{day:"numeric",month:"short"});
 return d.toLocaleDateString("es",{weekday:"short",day:"numeric",month:"short"})}
function esc(s){return s.replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function item(t){
 var u=!t.done&&t.date&&t.date<=today(),c=color(t.mat);
 return '<li class="'+(t.done?"done ":"")+(u?"urgent":"")+'" style="'+(c?"--c:"+c:"")+'" data-id="'+t.id+'">'+
 '<input class="chk" type="checkbox" aria-label="Completar" '+(t.done?"checked":"")+'>'+
 '<div class="body"><div class="t">'+esc(t.title)+'</div>'+((t.mat||t.date)?'<div class="meta">'+(t.mat?'<span class="m">'+esc(t.mat)+'</span>':'')+(t.date?'<span class="d">'+fmt(t.date)+'</span>':'')+'</div>':'')+'</div>'+
 '<button class="x" type="button" aria-label="Borrar">×</button></li>'}
function render(){
 var pend=S.tasks.filter(function(t){return!t.done}).sort(function(a,b){return(a.date||"9999")<(b.date||"9999")?-1:(a.date||"9999")>(b.date||"9999")?1:a.id-b.id});
 var done=S.tasks.filter(function(t){return t.done}).sort(function(a,b){return b.id-a.id});
 $("lp").innerHTML=pend.length?pend.map(item).join(""):'<li class="empty" style="display:block;border:0;background:none">'+(S.tasks.length?"Todo al día.":"Agregá tu primer pendiente.")+'</li>';
 $("sp").hidden=!done.length;$("nc").textContent="Completadas ("+done.length+")";$("th").textContent=S.hide?"Mostrar":"Ocultar";
 $("ld").innerHTML=S.hide?"":done.map(item).join("");
 var ms=[];S.tasks.forEach(function(t){if(t.mat&&ms.indexOf(t.mat)<0)ms.push(t.mat)});
 ["Resistencia de Materiales","Tecnología de la Construcción"].forEach(function(m){if(ms.indexOf(m)<0)ms.push(m)});
 $("mats").innerHTML=ms.map(function(m){return'<option value="'+esc(m)+'">'}).join("");
 document.body.classList.toggle("compact",S.compact);$("bc").textContent=S.compact?"Cómodo":"Compacto";
 var dark=S.theme?S.theme==="dark":matchMedia("(prefers-color-scheme:dark)").matches;
 if(S.theme)document.documentElement.setAttribute("data-theme",S.theme);
 $("bt").textContent=dark?"Claro":"Oscuro"}
function add(){var ti=$("ti").value.trim();if(!ti)return;
 S.tasks.push({id:Date.now(),title:ti,mat:$("ma").value.trim(),date:$("fe").value,done:false});
 $("ti").value="";$("fe").value="";save();render();$("ti").focus()}
$("go").onclick=add;
$("ti").onkeydown=function(e){if(e.key==="Enter")add()};
function click(e){var li=e.target.closest("li[data-id]");if(!li)return;var id=+li.dataset.id;
 if(e.target.classList.contains("x")){S.tasks=S.tasks.filter(function(t){return t.id!==id})}
 else if(e.target.classList.contains("chk")){S.tasks.forEach(function(t){if(t.id===id)t.done=!t.done})}
 else return;save();render()}
$("lp").onclick=click;$("ld").onclick=click;
$("th").onclick=function(){S.hide=!S.hide;save();render()};
$("bc").onclick=function(){S.compact=!S.compact;save();render()};
$("bt").onclick=function(){var dark=S.theme?S.theme==="dark":matchMedia("(prefers-color-scheme:dark)").matches;S.theme=dark?"light":"dark";save();render()};
render();
if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})}
})();
</script>
</body>
</html>
